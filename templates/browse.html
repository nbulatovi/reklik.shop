{% from 'macros.html' import icon, product_card with context %}
<section class="product-stream" aria-label="Pregled uređaja">
<div class="product-grid catalog-products" data-product-grid>{% for p in products %}{{product_card(p)}}{% endfor %}</div>
<div class="empty-collection" data-empty {% if products %}hidden{% endif %}>{{icon(category.icon if category else 'laptop',54)}}<h2>Nema uređaja za ovaj izbor.</h2><p>Promenite pretragu ili filtere.</p><button class="button button-outline" type="button" data-reset-filters>Prikaži sve uređaje</button></div>

</section>
